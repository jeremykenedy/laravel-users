name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.1', laravel: '8', testbench: '^6.0', dependencies: highest, legacy: true }
          - { php: '8.1', laravel: '9', testbench: '^7.0', dependencies: highest, legacy: true }
          - { php: '8.1', laravel: '10', testbench: '^8.0', dependencies: highest, legacy: true }
          - { php: '8.2', laravel: '11', testbench: '^9.0', dependencies: highest, legacy: true }
          - { php: '8.2', laravel: '12', testbench: '^10.0', dependencies: highest }
          - { php: '8.3', laravel: '12', testbench: '^10.0', dependencies: highest }
          - { php: '8.4', laravel: '12', testbench: '^10.0', dependencies: highest }
          - { php: '8.3', laravel: '13', testbench: '^11.0', dependencies: highest }
          - { php: '8.4', laravel: '13', testbench: '^11.0', dependencies: highest }
          - { php: '8.5', laravel: '13', testbench: '^11.0', dependencies: highest }
          - { php: '8.3', laravel: '13', testbench: '^11.0', dependencies: lowest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, pcntl
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - name: Select Testbench version
        run: composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-update --no-interaction
      - name: Enable Laravel 8 SQLite migration rollback tests
        if: matrix.laravel == '8'
        run: composer require --dev 'doctrine/dbal:^3.0' --no-update --no-interaction
      - name: Select oldest supported PHP parser
        if: matrix.laravel == '8'
        run: composer require 'nikic/php-parser:4.18.0' --no-update --no-interaction
      - name: Install supported dependencies
        if: ${{ !matrix.legacy }}
        run: composer update --prefer-dist --no-interaction ${{ matrix.dependencies == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}
      - name: Install historical compatibility dependencies
        if: matrix.legacy
        # Historical frameworks may have advisories. This exception is confined to compatibility testing.
        run: composer update --prefer-dist --no-interaction --no-security-blocking
      - run: composer test

  role-integrations:
    name: Optional roles / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.1', laravel: '8', testbench: '^6.0', spatie: '^5.0', legacy: true }
          - { php: '8.3', laravel: '12', testbench: '^10.0', spatie: '^6.0' }
          - { php: '8.5', laravel: '13', testbench: '^11.0', spatie: '^8.0' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, pcntl
          coverage: none
          tools: composer:v2
      - name: Select optional integration dependencies
        run: composer require --dev "orchestra/testbench:${{ matrix.testbench }}" "spatie/laravel-permission:${{ matrix.spatie }}" 'jeremykenedy/laravel-roles:^13.0' --no-update --no-interaction
      - name: Install supported dependencies
        if: ${{ !matrix.legacy }}
        run: composer update --prefer-dist --no-interaction --no-plugins
      - name: Install historical compatibility dependencies
        if: matrix.legacy
        run: composer update --prefer-dist --no-interaction --no-plugins --no-security-blocking
      - run: vendor/bin/phpunit --filter 'RoleIntegrationsTest|PackageSetupIntegrationsTest'

  presentation-integrations:
    name: Optional presentation / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', laravel: '12', testbench: '^10.0' }
          - { php: '8.5', laravel: '13', testbench: '^11.0' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite
          coverage: none
          tools: composer:v2
      - name: Select optional presentation dependencies
        run: composer require --dev "orchestra/testbench:${{ matrix.testbench }}" 'dicebear/core:^10.7' 'dicebear/styles:^10.6' 'jeremykenedy/laravel-toast:^3.0' --no-update --no-interaction
      - run: composer update --prefer-dist --no-interaction --no-plugins
      - run: vendor/bin/phpunit --filter 'AvatarProvidersTest|AvatarPreviewTest|ToastIntegrationsTest|ToastSettingsTest|PackageSetupIntegrationsTest|RuntimeCommandsTest'

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite, pcntl
          coverage: xdebug
          tools: composer:v2
      - run: composer update --prefer-dist --no-interaction
      - run: composer lint
      - run: composer audit
      - run: vendor/bin/phpunit --configuration phpunit.coverage.xml --coverage-php coverage-core.cov
        env:
          XDEBUG_MODE: coverage
      - name: Install optional packages for integration coverage
        run: composer require --dev 'livewire/livewire:^4.4' 'spatie/laravel-permission:^8.0' 'jeremykenedy/laravel-roles:^13.0' 'dicebear/core:^10.7' 'dicebear/styles:^10.6' 'jeremykenedy/laravel-toast:^3.0' --no-interaction --no-plugins
      - run: composer audit
      - run: vendor/bin/phpunit --configuration phpunit.coverage.xml --coverage-php coverage-optional.cov
        env:
          XDEBUG_MODE: coverage
      - name: Combine core and optional integration coverage
        run: |
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';
          $coverage = require 'coverage-core.cov';
          $coverage->merge(require 'coverage-optional.cov');
          (new SebastianBergmann\CodeCoverage\Report\Clover())->process($coverage, 'coverage.xml');
          PHP
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: php-coverage
          path: coverage.xml
          retention-days: 7

  browser:
    name: Blade UI / ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: composer update --prefer-dist --no-interaction
      - run: npm ci
      - run: npm audit
      - run: npm run test:runtime
      - run: npm run lint:docs
      - run: npm run build
      - run: git diff --exit-code -- src/resources/views/modern/tailwind.blade.php src/resources/assets
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:browser -- --project=${{ matrix.browser }} --grep-invert 'tailwind|materialize|material3|bulma|foundation'
      - name: Install Toast for notification browser coverage
        run: composer require --dev 'jeremykenedy/laravel-toast:^3.0' --no-interaction --no-plugins
      - name: Verify optional Toast previews and notification controls
        run: npm run test:browser -- --project=${{ matrix.browser }} --grep 'notification|toast' --grep-invert 'tailwind|materialize|material3|bulma|foundation'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: browser-failures-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
